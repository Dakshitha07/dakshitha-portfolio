function Reveal({children,className="",delay=0,as="div"}){
  const ref=useRef(null);
  useEffect(()=>{const el=ref.current;if(!el)return;
    const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add("in");io.disconnect()}},{threshold:.12});
    io.observe(el);return()=>io.disconnect()},[]);
  return React.createElement(as,{ref,className:"rv "+className,style:{transitionDelay:delay+"ms"}},children);
}

function Lightbox({list,idx,setIdx,label,hideTitle}){

    const k=e=>{if(e.key==="Escape")close();if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)};
    addEventListener("keydown",k);document.body.style.overflow="hidden";
    return()=>{removeEventListener("keydown",k);document.body.style.overflow=""}},[close,go]);
  const btn="p-3 rounded-full border shrink-0";
  return html`<div role="dialog" aria-modal="true" aria-label=${p.title} className="fixed inset-0 z-[100] flex flex-col px-5 md:px-10 pb-5" style=${{background:"var(--bg)",paddingTop:"calc(1rem + env(safe-area-inset-top,0px))"}}>
    <div className="flex items-center justify-between gap-4 pb-3">
      <div>${!hideTitle&&html`<div className="disp text-2xl md:text-4xl">${p.title}</div>`}<div className="text-xs mt-1" style=${{color:"var(--mute)"}}>${label||"Tools: Canva, AI tools"} · ${String(idx+1).padStart(2,"0")} / ${String(list.length).padStart(2,"0")}</div></div>
      <button onClick=${close} aria-label="Close" className=${btn} style=${{borderColor:"var(--fg)"}}><${Icon} n="x"/></button>
    </div>
    <div className="flex-1 min-h-0 flex items-center justify-between gap-3">
      <button onClick=${()=>go(-1)} aria-label="Previous" className=${btn} style=${{borderColor:"var(--fg)"}}><${Icon} n="left"/></button>
      <img src=${p.img} alt=${p.title} className="min-w-0 max-w-full max-h-full object-contain" style=${{height:"100%"}}/>
      <button onClick=${()=>go(1)} aria-label="Next" className=${btn} style=${{borderColor:"var(--fg)"}}><${Icon} n="right"/></button>
    </div></div>`;
}

function Experience(){
  return html`<section id="experience" className="px-5 md:px-10 py-24 max-w-[1400px] mx-auto">
    <${Reveal}><h2 className="disp mb-14" style=${{fontSize:"clamp(2.5rem,7vw,6rem)"}}>Creative<br/>Experience</h2><//>
    <div className="border-t" style=${{borderColor:"var(--line)"}}>
      ${EXPERIENCE.map((e,i)=>html`<${Reveal} key=${e.org} delay=${i*90}><div className="grid md:grid-cols-12 gap-3 md:gap-8 py-8 border-b group" style=${{borderColor:"var(--line)"}}>
        <span className="md:col-span-3 text-sm" style=${{color:"var(--mute)"}}>${e.when}</span>
        <div className="md:col-span-5"><h3 className="disp text-3xl md:text-4xl transition-colors group-hover:text-[var(--acc)]">${e.org}</h3><p className="mt-2 text-sm font-medium">${e.role}</p></div>
        <p className="md:col-span-4 text-sm leading-relaxed" style=${{color:"var(--mute)"}}>${e.text}</p>
      </div><//>`)}
    </div></section>`;
}

function Toolkit(){
  return html`<section id="toolkit" className="px-5 md:px-10 py-20 max-w-[1400px] mx-auto">
    <${Reveal}><h2 className="disp mb-10" style=${{fontSize:"clamp(2.5rem,7vw,6rem)"}}>My Creative <span style=${{color:"var(--acc)"}}>Toolkit</span></h2><//>
    <div className="flex flex-wrap gap-4">${TOOLS.filter(t=>t.confirmed).map((t,i)=>html`<${Reveal} key=${t.name} delay=${i*80}><div className="px-7 py-5 rounded-full border transition hover:bg-[var(--fg)] hover:text-[var(--bg)]" style=${{borderColor:"var(--fg)"}}><div className="disp text-2xl">${t.name}</div><div className="text-xs opacity-70 mt-1">${t.note}</div></div><//>`)}</div>
  </section>`;
}

function Services(){
  return html`<section id="services" className="px-5 md:px-10 py-24 max-w-[1400px] mx-auto">
    <${Reveal}><h2 className="disp mb-12" style=${{fontSize:"clamp(2.5rem,7vw,6rem)"}}>What I can<br/>do for you</h2><//>
    <ol className="border-t" style=${{borderColor:"var(--line)"}}>${SERVICES.map((s,i)=>html`<${Reveal} as="li" key=${s}><div className="group flex items-baseline gap-6 py-5 border-b cursor-default transition-all hover:pl-4" style=${{borderColor:"var(--line)"}}>
      <span className="text-xs w-8" style=${{color:"var(--mute)"}}>${String(i+1).padStart(2,"0")}</span>
      <span className="disp transition-colors group-hover:text-[var(--acc)]" style=${{fontSize:"clamp(1.8rem,5vw,3.6rem)"}}>${s}</span></div><//>`)}</ol>
  </section>`;
}

function Contact(){
  const L=({href,n,t,ext})=>html`<a href=${href} target=${ext?"_blank":"_self"} rel="noopener noreferrer" className="lnk inline-flex items-center gap-2"><${Icon} n=${n}/>${t}</a>`;
  return html`<section id="contact" className="px-5 md:px-10 pt-24 pb-10 max-w-[1400px] mx-auto">
    <${Reveal}><h2 className="disp" style=${{fontSize:"clamp(3rem,11vw,9.5rem)"}}>Have a project<br/><span style=${{color:"var(--acc)"}}>in mind?</span></h2>
      <p className="mt-6 text-lg">Let's create something meaningful together.</p>
      <a href=${"mailto:"+SITE.email+"?subject=Project%20enquiry"} className="mt-8 inline-flex items-center gap-2 px-7 py-4 rounded-full text-sm transition hover:opacity-80" style=${{background:"var(--fg)",color:"var(--bg)"}}>Start a conversation <${Icon} n="arrow"/></a>
      <div className="mt-10 flex flex-wrap gap-x-8 gap-y-4 text-sm"><${L} href=${"mailto:"+SITE.email} n="mail" t=${SITE.email}/><${L} href=${"tel:+91"+SITE.phone} n="phone" t=${"+91 "+SITE.phone}/><${L} href=${SITE.linkedin} n="linkedin" t="LinkedIn" ext=${true}/><${L} href=${SITE.instagram} n="instagram" t="Instagram" ext=${true}/></div><//>
    <footer className="mt-20 pt-6 border-t flex justify-between text-xs" style=${{borderColor:"var(--line)",color:"var(--mute)"}}><span>© 2026 Pathipati Dakshitha</span><a href="#top" className="lnk">Back to top ↑</a></footer>
  </section>`;
}

function App(){
  const [idx,setIdx]=useState(null);
  return html`<main><${Nav}/><${Hero}/><${About}/><${Work} onOpen=${setIdx}/>
    ${idx!==null&&html`<${Lightbox} list=${PROJECTS} idx=${idx} setIdx=${setIdx} hideTitle=${true}/>`}
    <${Docs}/><${Experience}/><${Toolkit}/><${Services}/><${Contact}/></main>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
